[package]
name = "easytidy-ctool"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "easytidy-ctool"
path = "src/main.rs"

# 容器内 root 一次性工具（ro bind-mount 到 /usr/bin/easytidy-ctool）。
# 薄壳：参数解析后调 easytidy_core::incontainer（纯 Rust，零容器内命令
# 依赖）。以 musl 静态构建（与 server 同目标），alpine/busybox/debian
# 通吃。刻意不引入 tokio/crossterm 等容器内用不到的重依赖。
[dependencies]
easytidy-core = { path = "../core" }
clap = { workspace = true }
anyhow = { workspace = true }
