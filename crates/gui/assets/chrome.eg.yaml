# 容器配置示例 —— 经典 Chrome 容器模板（GUI 透传）
#
# conf 模板 = 静态意图;宿主耦合的运行时数据(DISPLAY/WAYLAND/XAUTHORITY/
# XDG_RUNTIME_DIR 等)在「使用」预填时由 Rust 端从宿主 env 实时注入
# (见 core::conf_template::ConfTemplate::build_config + inject_gui_passthrough)。
# 模板仅作创建期预填——容器创建后即自包含、与模板解耦(无血缘/同步/漂移)。
#
# GUI 透传开关 = gui: true（展开时宿主 env 自动注入 + 字体图标只读挂载 + /tmp/.X11-unix +
# $XDG_RUNTIME_DIR 挂载 + user_home 强开 keep-id）。
# entry_args 加 --ozone-platform=wayland：Wayland 会话下 Chrome 走 Wayland 而非 X11,
# 避免 X11 链路上的 XAUTHORITY 不可达 / dbus 系统总线缺失导致的初始化失败。
#
# 加载路径:MasterView「配置编辑器」→ 顶部模板选 "chrome" → 预填表单 →
# 提交创建容器（env 在创建时由 Rust 注入,模板里不写死）。

name: chrome
image: docker.io/library/ubuntu:24.04
gui: true
entry: google-chrome-stable
entry_args:
  - --ozone-platform=wayland  # Wayland 会话下避免 X11 初始化失败
silent_boot: false
persistent: true
user_home: true

# GPU 透传（NVIDIA Container Toolkit）：勾选后注入 nvidia.com/gpu=all CDI + NVIDIA_* env
gpu_nvidia: true
security_opts:
  - label=disable
  - apparmor=unconfined

mounts:
  # X11 socket（Wayland 会话下兜底兼容 X11 应用）
  - host_path: /tmp/.X11-unix
    container_path: /tmp/.X11-unix
    read_only: false
  # 宿主 $XDG_RUNTIME_DIR（Wayland socket / dbus / XAUTHORITY）
  - host_path: /run/user/1000
    container_path: /run/user/1000
    read_only: false
  # 宿主字体（只读,经 /mnt/host 路径接入 fontconfig）
  - host_path: /usr/share/fonts
    container_path: /mnt/host/fonts
    read_only: true
  - host_path: /usr/share/icons
    container_path: /mnt/host/icons
    read_only: true

network:
  mode: host
  ports: []

# XDG_DATA_DIRS 非 session 耦合（gdk-pixbuf loader cache 需要宿主目录追加在系统默认之前）,
# 保留在模板里。DISPLAY/WAYLAND_DISPLAY/XAUTHORITY/XDG_RUNTIME_DIR 在展开时按宿主 env
# 动态注入,模板里不写。
env:
  - XDG_DATA_DIRS=/mnt/host:/usr/local/share:/usr/share

setup: []
flavor: chrome