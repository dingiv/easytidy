[package]
name = "easytidy-gui"
version.workspace = true
description = "easytidy GUI manager"
authors = ["easytidy contributors"]
edition.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "easytidy_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
easytidy-shared = { path = "../shared" }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
easytidy-core = { path = "../core" }
easytidy-protocol = { path = "../protocol" }
dirs = { workspace = true }
rfd = "0.15"
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
base64 = "0.22"
tracing-appender = "0.2.5"

# （dev 期 server binary 路径解析走 core::server_binary_path() → shared::loader!
#   读 core 的 [package.metadata.shared] SERVER_BIN namespace，
#   GUI 自己不声明 namespace。）

[dev-dependencies]
tempfile = { workspace = true }
# 让 Cargo 把 crates/server 纳入 GUI 的指纹图（没有这段 build.rs
# 的 rerun-if-changed=../server/src 会警告"指向包外"）。dev-dep 不
# 编进 cargo build，只编进 cargo test —— 零二进制膨胀，纯 file-watch
# 触发（build.rs 自动 rebuild server）。详见 build.rs。
easytidy-server = { path = "../server" }
