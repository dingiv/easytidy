# 容器配置示例 —— 桌面开发容器（Ubuntu 24.04 GUI 透传底座）
#
# 字段对齐 crates/gui/ui/types/index.ts 的 ContainerConfig 接口：
#   name / image / entry / entry_args / silent_boot / persistent /
#   mounts / network / env / keep_id / flavor
#
# 加载路径：MasterView 「配置编辑器」 → ContainerConfigEditor 顶部"加载 YAML"
# → 此文件被解析 → 表单预填 → 提交 env_new(config) 创建并启动容器。
#
# 导出路径：填好表单 → "导出 YAML" → 保存为可分享 / 可重复使用的 YAML。

name: dev-gui                   # 容器名（必填，registry 唯一）
image: docker.io/library/ubuntu:24.04
entry: /bin/bash                # 容器入口应用（可留空，server 不拉起应用）
entry_args: []
silent_boot: false              # 宿主开机时不静默拉起
persistent: true                # 容器常驻：catatonit + server 托管生命周期

# 用户一致性映射（keep-id）：容器内 uid 与宿主对齐，应用默认以容器默认
# 用户运行（家目录 = 该用户 passwd home，容器层持久）
keep_id: true

# 路径映射（bind mount）
mounts:
  - host_path: /home/user/workspace
    container_path: /workspace
    read_only: false
  - host_path: /home/user/.config
    container_path: /home/node/.config
    read_only: false

# 网络：host 模式（默认；mapped 模式需端口列表）
network:
  mode: host
  ports: []

# 容器内环境变量（"KEY=VALUE" 列表；EASYTIDY_USER_* 由引擎保留注入，
# 手动写入会被覆盖）
env:
  - LANG=en_US.UTF-8
  - DISPLAY=:0

# 血缘标记：此配置由 flavor 模板展开后保存（可空 = 自由创建）
# flavor: dev-template