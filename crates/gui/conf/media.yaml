# 容器配置示例 —— 桌面媒体容器（带端口映射的 bridge 网络）
#
# 与 container.dev.yaml 同一 schema，但展示：
#   - mapped 网络模式 + 端口映射表
#   - 多挂载（含只读）
#   - 自定义应用入口 + 参数
#   - flavor 血缘标记（保留模板溯源）

name: media-bridge
image: docker.io/library/ubuntu:24.04
entry: /usr/bin/firefox           # 容器入口应用
entry_args:
  - --no-remote
  - --new-instance
silent_boot: false
persistent: true

keep_id: true

mounts:
  # 数据盘：读写
  - host_path: /mnt/user-data/media
    container_path: /media
    read_only: false
  # 系统字体目录：只读，注入容器内 fontconfig
  - host_path: /usr/share/fonts
    container_path: /usr/share/fonts
    read_only: true

# 网络：mapped（bridge），容器对外暴露端口需要走这里
network:
  mode: mapped
  ports:
    - host_port: 8080
      container_port: 80
      protocol: tcp
    - host_port: 5900
      container_port: 5900
      protocol: tcp       # VNC 备用

env:
  - LANG=en_US.UTF-8
  - DISPLAY=:0

# 血缘标记：此配置由对应 flavor 模板展开而来，便于"按模板同步"
flavor: media