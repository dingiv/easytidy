[package]
name = "easytidy-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bollard = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
tower-service = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
easytidy-protocol = { path = "../protocol" }
easytidy-shared = { path = "../shared" }
uuid = { workspace = true }
tempfile = { workspace = true }
dirs = { workspace = true }
fs2 = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
libc = { workspace = true }
tar = { workspace = true }

[build-dependencies]
easytidy-shared = { path = "../shared" }

# dev/prod 路径 namespace —— 唯一事实源，仅 core 保留（GUI/CLI 统一走
# core::server_binary_path()）。语义：**根 = bin 目录**，helper 拼 `easytidy-server`。
# dev 根相对 core 的 manifest（crates/core），向上两级到 workspace root 后接
# target/debug（dev 构建树，cargo run / cargo test / tauri dev 的 live server）。
# prod 根 = **发布随包安装位**：server 随安装包一起发布（不再有 build-server），
# deb 打包把 easytidy-server 装到 /usr/bin（或 per-user 备选 ~/.local/share/easytidy，
# 若改走该位只改这一行即可）。打包阶段（如 deb）按实际布局在此配置。
# （$XDG_DATA_HOME/easytidy/bin 作为历史兼容回退由 server_binary_path() 内部处理。）
[package.metadata.shared]
SERVER_BIN = { dev = "../../target/x86_64-unknown-linux-musl/debug/", prod = "/usr/bin" }
# 容器内 root 工具（/run/easytidy-bin/easytidy-dock：prepare 容器准备 +
# daemon/bootstrap/client root 终端通道，2026-09-02 由 root-channel + ctool
# 合并）：与 server 同为 musl 静态二进制（同一构建目标目录）——bind-mount
# 进容器后不依赖镜像内任何命令（无 sh/useradd/sed）。dev 须
# `cargo build -p easytidy-dock --target x86_64-unknown-linux-musl`（gui
# beforeDevCommand 已含）。
DOCK_BIN = { dev = "../../target/x86_64-unknown-linux-musl/debug/", prod = "/usr/bin" }
# GUI 透传规则等内置资源（内容，非代码）：dev = 源码树 crates/gui/assets
# （core manifest 的 ../gui/assets）；prod = 数据目录 ~/.easytidy/assets（首跑从
# 内嵌默认播种、可被用户定制）。core 经 ASSETS_DIR:: 加载（见 gui_passthrough.rs）。
ASSETS_DIR = { dev = "../gui/assets", prod = "~/.easytidy/assets" }
# 容器配置根目录（**每容器一个 `<name>.toml`**，目录即注册表，无单文件）：
# dev = 源码树 crates/core/data/containers（git-ignore，与已安装实例隔离）；
# prod = ~/.easytidy/data/containers。core 经 CONTAINERS:: 解析（configfile.rs）。
CONTAINERS = { dev = "data/containers", prod = "~/.easytidy/data/containers" }
