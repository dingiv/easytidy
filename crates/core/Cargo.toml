[package]
name = "easytidy-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bollard = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
tower-service = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
easytidy-protocol = { path = "../protocol" }
easytidy-shared = { path = "../shared" }
uuid = { workspace = true }
tempfile = { workspace = true }
dirs = { workspace = true }
fs2 = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
libc = { workspace = true }

[build-dependencies]
easytidy-shared = { path = "../shared" }

# dev/prod 路径 namespace —— 唯一事实源，仅 core 保留（GUI/CLI 统一走
# core::server_binary_path()）。语义：**根 = bin 目录**，helper 拼 `easytidy-server`。
# dev 根相对 core 的 manifest（crates/core），向上两级到 workspace root 后接
# target/debug（dev 构建树，cargo run / cargo test / tauri dev 的 live server）。
# prod 根 = **发布随包安装位**：server 随安装包一起发布（不再有 build-server），
# deb 打包把 easytidy-server 装到 /usr/bin（或 per-user 备选 ~/.local/share/easytidy，
# 若改走该位只改这一行即可）。打包阶段（如 deb）按实际布局在此配置。
# （$XDG_DATA_HOME/easytidy/bin 作为历史兼容回退由 server_binary_path() 内部处理。）
[package.metadata.shared]
SERVER_BIN = { dev = "../../target/debug", prod = "/usr/bin" }
