[workspace]
resolver = "2"
members = ["crates/protocol", "crates/core", "crates/server", "crates/cli"]
exclude = ["spikes/cjk-spike/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["easytidy contributors"]
repository = "https://github.com/dingiv/easy-tidy"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync", "process", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
bollard = "0.18"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
http-body-util = "0.1"
tower-service = "0.3"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
dirs = "5"
fs2 = "0.4"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
libc = "0.2"

[profile.release]
lto = true
strip = true

[profile.release.package.easytidy-server]
opt-level = "z"
